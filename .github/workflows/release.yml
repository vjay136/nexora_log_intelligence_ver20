name: NLI V20 release

on:
  push:
    branches: [main]
    tags: ['v20.*']
  pull_request:
    paths:
      - 'packaging/**'
      - 'scripts/release/**'
      - 'tests/release/**'
      - 'tests/rocky/**'
      - 'Makefile'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      previous_release_tag:
        description: 'Optional previous Ver20 release tag containing genuine client/controller RPMs; defaults to v20.0.0-1'
        required: false
        type: string

permissions:
  contents: read

jobs:
  infrastructure-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1, Node.js 24
        with:
          fetch-depth: 0
      - name: Validate release infrastructure
        env:
          NLI_BUILD_SCRATCH: ${{ runner.temp }}
        run: make release-static
      - name: Test Go and Web contracts
        run: |
          go test ./...
          go vet ./...
          npm run web:check
      - name: Run Linux race detector
        run: go test -race ./...
      - name: Test Vite production build and browser UI
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          npm run build
          npm run test:ui
      - name: Prove deterministic RPM and evidence pipeline
        env:
          NLI_BUILD_SCRATCH: ${{ runner.temp }}
        run: make release-package-test


  release-candidate:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v20.')
    needs: infrastructure-static
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1, Node.js 24
        with:
          fetch-depth: 0
      - name: Build reproducible release
        env:
          NLI_BUILD_SCRATCH: ${{ runner.temp }}
        run: make release-build OUTPUT_DIR='${{ runner.temp }}/nli-release'
      - name: Download genuine previous release RPMs
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RELEASE_TAG: ${{ inputs.previous_release_tag || 'v20.0.0-1' }}
          PREVIOUS_RELEASE_REPO: vjay136/nexora_log_intelligence_ver20
        run: |
          mkdir -p '${{ runner.temp }}/previous'
          previous_release_tag="$PREVIOUS_RELEASE_TAG"
          if [[ -z "$previous_release_tag" ]]; then
            previous_release_tag=$(gh release list --repo "$PREVIOUS_RELEASE_REPO" --limit 100 \
              --json tagName,isDraft,isPrerelease,publishedAt \
              --jq 'map(select(.isDraft == false and .isPrerelease == false)) | sort_by(.publishedAt) | reverse | .[0].tagName')
          fi
          if [[ -z "$previous_release_tag" || "$previous_release_tag" == "null" ]]; then
            echo "No published previous Ver20 release is available in $PREVIOUS_RELEASE_REPO" >&2
            exit 1
          fi
          echo "Using previous lifecycle baseline $PREVIOUS_RELEASE_REPO@$previous_release_tag"
          gh release view "$previous_release_tag" --repo "$PREVIOUS_RELEASE_REPO" >/dev/null
          gh release download "$previous_release_tag" --repo "$PREVIOUS_RELEASE_REPO" \
            --pattern '*.rpm' --dir '${{ runner.temp }}/previous'
          shopt -s nullglob
          previous_rpms=('${{ runner.temp }}/previous'/*.rpm)
          if (( ${#previous_rpms[@]} < 2 )); then
            echo "Expected genuine client and controller RPMs in $PREVIOUS_RELEASE_REPO@$previous_release_tag" >&2
            exit 1
          fi
          echo 'REQUIRE_PREVIOUS=1' >> "$GITHUB_ENV"
      - name: Validate Rocky 9 and Rocky 10.2 lifecycle
        env:
          NLI_BUILD_SCRATCH: ${{ runner.temp }}
        run: make release-rocky OUTPUT_DIR='${{ runner.temp }}/nli-release' PREVIOUS_DIR='${{ runner.temp }}/previous'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node.js 24
        with:
          name: nli-v20-unsigned-release
          path: ${{ runner.temp }}/nli-release/
          if-no-files-found: error
          retention-days: 14
      - name: Publish V20 GitHub release
        if: startsWith(github.ref, 'refs/tags/v20.')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" '${{ runner.temp }}/nli-release/'* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nexora Log Intelligence Ver20 — $GITHUB_REF_NAME" \
            --notes-file docs/release/README.md \
            --latest
